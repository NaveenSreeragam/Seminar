<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Forensic Evidence Transfer</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="shell">
    <header>
      <div class="badge">FORENSIC LAB • CONTROLLED DEMO</div>
      <h1>Evidence Transfer Portal</h1>
      <p>Securely prepare a ZIP evidence package for transfer to a VirtualBox forensic lab.</p>
    </header>

    <section class="card">
      <label class="drop" id="drop">
        <input id="file" type="file" accept=".zip,application/zip">
        <span class="icon">⬆</span>
        <strong>Select ZIP evidence</strong>
        <small>or drag and drop a .zip file here</small>
      </label>

      <div id="details" class="details hidden">
        <div><span>FILE</span><b id="name">—</b></div>
        <div><span>SIZE</span><b id="size">—</b></div>
        <div><span>SHA-256</span><code id="hash">Calculating…</code></div>
      </div>

      <button id="upload" disabled>Upload evidence package</button>
      <div class="progress hidden"><div id="bar"></div></div>
      <p id="status" class="status">Choose a ZIP file to begin.</p>
    </section>

    <section class="card">
      <h2>Transfer log</h2>
      <div id="log" class="log">No transfer recorded.</div>
    </section>
  </main>
  <script src="/script.js"></script>
</body>
</html>
